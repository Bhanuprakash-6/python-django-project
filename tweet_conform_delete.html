{% include 'layout.html' %}

{% block title %}
    <h3 class="text-4xl text-center font-bold text-red-600 mt-6">Confirm Delete</h3>
{% endblock %}

{% block content %}
<div class="flex justify-center mt-12">
    <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8 text-center">
        
        <!-- Warning Icon + Heading -->
        <div class="flex justify-center mb-4">
            <svg class="w-12 h-12 text-red-500" fill="none" stroke="currentColor" stroke-width="2" 
                 viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" 
                      d="M12 9v2m0 4h.01M12 5a7 7 0 00-7 7v5h14v-5a7 7 0 00-7-7z" />
            </svg>
        </div>

        <h2 class="text-xl font-semibold text-gray-800 mb-2">
            Are you sure you want to delete this tweet?
        </h2>
        
        <p class="text-gray-600 mb-4"><strong>{{ tweet.text }}</strong></p>
        
        {% if tweet.photo %}
            <img src="{{ tweet.photo.url }}" alt="Tweet photo" 
                 class="mx-auto rounded-md shadow-md mb-6 w-full max-w-xs h-48 object-cover"/>
        {% endif %}
        
        <!-- Form -->
        <form method="post" class="flex justify-center gap-4">
            {% csrf_token %}
            <button type="submit" 
                    class="px-6 py-2 bg-red-500 hover:bg-red-600 text-white font-semibold rounded-lg shadow-md transition duration-300">
                🗑️ Yes, Delete
            </button>
            <a href="{% url 'tweet_list' %}" 
               class="px-6 py-2 bg-gray-400 hover:bg-gray-500 text-white font-semibold rounded-lg shadow-md transition duration-300">
                ❌ Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
