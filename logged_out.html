{% extends 'layout.html' %}

{% block content %}
<div class="flex justify-center items-center min-h-screen bg-gray-100">
    <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8 text-center">
        
        <!-- Icon -->
        <div class="flex justify-center mb-4">
            <svg class="w-12 h-12 text-red-500" fill="none" stroke="currentColor" stroke-width="2" 
                 viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" 
                      d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1m0-10V5m0 14a9 9 0 110-18 9 9 0 010 18z" />
            </svg>
        </div>

        <!-- Heading -->
        <h2 class="text-2xl font-bold text-gray-800 mb-2">You’ve been logged out</h2>
        <p class="text-gray-600 mb-6">Your session has ended successfully.</p>

        <!-- Login Link -->
        <a href="{% url 'login' %}" 
           class="inline-block px-6 py-3 bg-blue-500 hover:bg-blue-600 text-white font-semibold rounded-lg shadow-md transition duration-300">
            🔑 Login Here
        </a>
    </div>
</div>
{% endblock %}
