{% extends 'layout.html' %}

{% block content %}
<div class="flex justify-center items-center min-h-screen bg-gray-100 text-black">
    <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8">
        
        <!-- Heading -->
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">Register</h1>
        
        <!-- Form -->
        <form method="post" class="space-y-5">
            {% csrf_token %}
            
            <!-- Render form fields -->
            <div class="space-y-4">
                {{ form.as_p }}
            </div>
            
            <!-- Buttons -->
            <button type="submit" 
                    class="w-full px-6 py-3 bg-blue-500 hover:bg-blue-600 text-white font-semibold rounded-lg shadow-md transition duration-300">
                🚀 Register
            </button>
        </form>
        
        <!-- Extra link -->
        <p class="text-center text-blue-500-600 text-sm mt-4">
            Already have an account? 
            <a href="{% url 'login' %}" class="text-blue-500 hover:underline">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
